<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start</title>
<style>
  :root { --bg:#0e0d0c; --fg:#d9d4cc; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg); overflow:hidden; font-family:Georgia,"Times New Roman",serif; }
  body { display:flex; align-items:center; justify-content:center; transition:opacity .05s; }
  #start { font:inherit; font-size:clamp(1.6rem,6vw,2.6rem); letter-spacing:.08em; color:var(--fg); background:none;
    border:1px solid #4a4640; padding:.7em 1.8em; cursor:pointer; transition:border-color .2s; }
  #start:hover, #start:focus-visible { border-color:var(--fg); outline:none; }
  #wait { display:none; font-size:1.1rem; color:#6c675f; }
  #wait.on { display:block; animation:breathe 2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity:.25; } }
  #own { position:fixed; bottom:calc(14px + env(safe-area-inset-bottom,0px)); left:0; right:0; text-align:center; font-size:.8rem; color:#4a4640; cursor:pointer; }
  #own:hover { color:#8a847a; }
  body.tense { animation:tense 5s ease-in forwards; }
  @keyframes tense { to { background:#000; } }

  #scare { position:fixed; inset:0; background:#000; display:none; align-items:center; justify-content:center; z-index:9; overflow:hidden; }
  #scare.on { display:flex; animation:shake .07s linear infinite; }
  #scare svg, #scare img { width:min(120vmin,130vw); max-height:130vh; object-fit:contain; transform-origin:50% 55%;
    animation:zoom .16s cubic-bezier(.1,.9,.2,1) forwards, glitch .8s steps(1) .2s infinite; }
  #scare img { display:none; } #scare.own svg { display:none; } #scare.own img { display:block; }
  #grain, #fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #grain { mix-blend-mode:overlay; opacity:.55; image-rendering:pixelated; }
  #fx { background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.85) 100%),
        repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:10; }
  #flash.on { animation:flash .3s steps(2) 2; }
  @keyframes zoom { from { transform:scale(.15); } to { transform:scale(1.6); } }
  @keyframes glitch {
    0%,60%,100% { filter:contrast(1.25) saturate(.9) drop-shadow(4px 0 rgba(255,0,0,.55)) drop-shadow(-4px 0 rgba(0,255,255,.45)); }
    70% { filter:contrast(1.7) brightness(1.5) drop-shadow(10px 0 rgba(255,0,0,.7)) drop-shadow(-10px 0 rgba(0,255,255,.6)); }
    85% { filter:contrast(1.4) brightness(.5) drop-shadow(-6px 0 rgba(255,0,0,.6)); } }
  @keyframes shake { 0%{transform:translate(0,0)} 25%{transform:translate(-14px,10px)} 50%{transform:translate(12px,-12px)} 75%{transform:translate(-10px,-8px)} 100%{transform:translate(8px,12px)} }
  @keyframes flash { 0%,100%{opacity:0} 50%{opacity:1} }
  @media (prefers-reduced-motion:reduce) { #scare.on, #scare svg, #scare img { animation:none; } #scare svg, #scare img { transform:scale(1); } }
</style>
</head>
<body>
<button id="start" type="button">Start</button>
<div id="wait" aria-live="polite">Loading...</div>
<label id="own">use your own photo<input id="file" type="file" accept="image/*" hidden></label>

<div id="flash"></div>
<div id="scare" role="alert" aria-label="Jumpscare">
  <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="skin" cx="50%" cy="62%" r="62%"><stop offset="0" stop-color="#cdb9a2"/><stop offset=".55" stop-color="#8a7560"/><stop offset="1" stop-color="#1b1411"/></radialGradient>
      <radialGradient id="sock" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#000"/><stop offset=".6" stop-color="#1a0f0c"/><stop offset="1" stop-color="#1a0f0c" stop-opacity="0"/></radialGradient>
      <radialGradient id="ball" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#f1e9dc"/><stop offset="1" stop-color="#9c8b76"/></radialGradient>
      <radialGradient id="mouth" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#000"/><stop offset=".7" stop-color="#2a0507"/><stop offset="1" stop-color="#4a0a0d"/></radialGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
      <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
      <filter id="tex" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7" result="n"/>
        <feColorMatrix in="n" values="0 0 0 0 .08  0 0 0 0 .05  0 0 0 0 .04  0 0 0 1.1 -.3" result="g"/>
        <feComposite in="g" in2="SourceGraphic" operator="in" result="g2"/>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="g2"/></feMerge>
      </filter>
    </defs>
    <rect width="400" height="400" fill="#050303"/>
    <g filter="url(#tex)"><path d="M200 22C118 22 72 92 76 178c3 52 22 82 38 104 10 42 28 96 86 96s76-54 86-96c16-22 35-52 38-104C328 92 282 22 200 22Z" fill="url(#skin)"/></g>
    <ellipse cx="118" cy="255" rx="30" ry="50" fill="#000" opacity=".5" filter="url(#blur)"/>
    <ellipse cx="282" cy="255" rx="30" ry="50" fill="#000" opacity=".5" filter="url(#blur)"/>
    <g stroke="#3a2c22" stroke-width="2" fill="none" opacity=".55" filter="url(#soft)"><path d="M130 90c40-8 100-8 140 0M138 106c36-6 88-6 124 0M148 120c30-4 74-4 104 0"/></g>
    <ellipse cx="143" cy="160" rx="54" ry="58" fill="url(#sock)"/><ellipse cx="257" cy="160" rx="54" ry="58" fill="url(#sock)"/>
    <ellipse cx="143" cy="162" rx="33" ry="37" fill="url(#ball)"/><ellipse cx="257" cy="162" rx="33" ry="37" fill="url(#ball)"/>
    <g stroke="#a3171c" stroke-width="1.2" fill="none" opacity=".85">
      <path d="M112 150c10 4 18 8 24 14M114 176c10-2 18-6 24-10M150 126c0 10 0 18 2 26M120 190c8-6 16-12 20-18M174 168c-8 0-16-2-24-6M176 146c-8 4-14 8-20 14"/>
      <path d="M288 150c-10 4-18 8-24 14M286 176c-10-2-18-6-24-10M250 126c0 10 0 18-2 26M280 190c-8-6-16-12-20-18M226 168c8 0 16-2 24-6M224 146c8 4 14 8 20 14"/></g>
    <circle cx="143" cy="164" r="12" fill="#2a1a10"/><circle cx="257" cy="164" r="12" fill="#2a1a10"/>
    <circle cx="143" cy="164" r="5.5" fill="#000"/><circle cx="257" cy="164" r="5.5" fill="#000"/>
    <circle cx="139" cy="159" r="2.5" fill="#fff"/><circle cx="253" cy="159" r="2.5" fill="#fff"/>
    <path d="M106 150c10-24 54-30 74-4M294 150c-10-24-54-30-74-4" stroke="#1a0f0c" stroke-width="6" fill="none" filter="url(#soft)"/>
    <path d="M192 140c-6 30-8 60-12 82M208 140c6 30 8 60 12 82" stroke="#2a1d16" stroke-width="5" fill="none" opacity=".6" filter="url(#soft)"/>
    <ellipse cx="188" cy="232" rx="5" ry="8" fill="#150c09"/><ellipse cx="212" cy="232" rx="5" ry="8" fill="#150c09"/>
    <path d="M124 268c8 100 144 100 152 0-38-28-114-28-152 0Z" fill="url(#mouth)" stroke="#3b1713" stroke-width="5"/>
    <path d="M139 277c36 17 86 17 122 0" stroke="#d8cfa8" stroke-width="17" fill="none" stroke-dasharray="9 3"/>
    <path d="M148 334c30 12 74 12 104 0" stroke="#b5aa80" stroke-width="13" fill="none" stroke-dasharray="8 3"/>
    <ellipse cx="200" cy="322" rx="38" ry="13" fill="#5a1215" opacity=".9"/>
    <path d="M140 288c-4 10-6 20-4 30M262 290c4 10 6 20 4 30" stroke="#3b1713" stroke-width="2" fill="none"/>
    <g stroke="#050303" stroke-width="3" fill="none" opacity=".92"><path d="M110 40C86 120 98 200 82 270M150 28c-12 50-6 92 6 126M250 28c12 50 6 92-6 126M292 44c20 80 8 150 24 220M180 24c-4 30-2 50 2 66"/></g>
  </svg>
  <img id="ownimg" alt="">
  <canvas id="grain" width="160" height="160"></canvas>
  <div id="fx"></div>
</div>

<script>
(function () {
  var startBtn = document.getElementById('start'), wait = document.getElementById('wait');
  var scare = document.getElementById('scare'), flash = document.getElementById('flash');
  var own = document.getElementById('own'), grain = document.getElementById('grain');
  var ctx = null, dread = null, beatTimer = null, grainTimer = null;

  document.getElementById('file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { document.getElementById('ownimg').src = r.result; scare.classList.add('own'); own.textContent = 'photo loaded'; };
    r.readAsDataURL(f);
  });

  function unlockAudio() {
    try { var AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); if (ctx.resume) ctx.resume(); } catch (e) { ctx = null; }
  }
  function reverb() {
    var len = Math.floor(ctx.sampleRate * 1.8), b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) { var d = b.getChannelData(c); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    var cv = ctx.createConvolver(); cv.buffer = b; return cv;
  }
  function noiseBuf(sec) {
    var n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    var s = ctx.createBufferSource(); s.buffer = b; return s;
  }

  // Human-style scream: sawtooth voice through vowel formants, vibrato, breath, room reverb
  function scream() {
    if (!ctx) return;
    try {
      var t = ctx.currentTime, dur = 2.2;
      var master = ctx.createGain();
      master.gain.setValueAtTime(0.0001, t); master.gain.exponentialRampToValueAtTime(1, t + 0.03);
      master.gain.setValueAtTime(1, t + 1.3); master.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      var ws = ctx.createWaveShaper(), cu = new Float32Array(256);
      for (var j = 0; j < 256; j++) cu[j] = Math.tanh((j / 128 - 1) * 3.5);
      ws.curve = cu;
      var comp = ctx.createDynamicsCompressor(), rv = reverb(), wet = ctx.createGain(); wet.gain.value = 0.4;
      master.connect(ws); ws.connect(comp); comp.connect(ctx.destination); comp.connect(rv); rv.connect(wet); wet.connect(ctx.destination);

      [1, 1.012].forEach(function (det) {
        var src = ctx.createOscillator(); src.type = 'sawtooth';
        src.frequency.setValueAtTime(420 * det, t);
        src.frequency.exponentialRampToValueAtTime(900 * det, t + 0.25);
        src.frequency.linearRampToValueAtTime(740 * det, t + dur);
        var lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 7.5; lg.gain.value = 30;
        lfo.connect(lg); lg.connect(src.frequency); lfo.start(t); lfo.stop(t + dur);
        [[850, 9, 1], [1250, 11, 0.8], [2900, 14, 0.5], [3800, 14, 0.3]].forEach(function (f) {
          var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f[0]; bp.Q.value = f[1];
          var g = ctx.createGain(); g.gain.value = f[2] * 1.4; src.connect(bp); bp.connect(g); g.connect(master);
        });
        src.start(t); src.stop(t + dur);
      });
      var br = noiseBuf(dur), hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
      var bg = ctx.createGain(); bg.gain.value = 0.45; br.connect(hp); hp.connect(bg); bg.connect(master); br.start(t);

      var k = ctx.createOscillator(); k.type = 'sine';
      k.frequency.setValueAtTime(95, t); k.frequency.exponentialRampToValueAtTime(28, t + 0.45);
      var kg = ctx.createGain(); kg.gain.value = 1.3; k.connect(kg); kg.connect(ctx.destination);
      k.start(t); k.stop(t + 0.5);
    } catch (e) {}
  }

  function thump(vol) {
    if (!ctx) return;
    try {
      var t = ctx.currentTime;
      [0, 0.16].forEach(function (off, i) {
        var o = ctx.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(70, t + off); o.frequency.exponentialRampToValueAtTime(35, t + off + 0.12);
        var g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t + off); g.gain.exponentialRampToValueAtTime(vol * (i ? 0.6 : 1), t + off + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.2);
        o.connect(g); g.connect(ctx.destination); o.start(t + off); o.stop(t + off + 0.25);
      });
    } catch (e) {}
  }
  // Room tone + low drone that swell, plus a creaking-door glide near the end
  function startDread(total) {
    if (ctx) {
      try {
        var t = ctx.currentTime, g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + total / 1000);
        var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220; lp.connect(g); g.connect(ctx.destination);
        var nodes = [55, 58.5, 82].map(function (f) { var o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(t); return o; });
        var room = noiseBuf(total / 1000 + 1), rl = ctx.createBiquadFilter(); rl.type = 'lowpass'; rl.frequency.value = 400;
        var rg = ctx.createGain(); rg.gain.value = 0.05; room.connect(rl); rl.connect(rg); rg.connect(ctx.destination); room.start(t);
        dread = { nodes: nodes.concat([room]) };
        setTimeout(function () { creak(); }, total * 0.45);
      } catch (e) {}
    }
    var begin = Date.now();
    (function beat() {
      var p = Math.min(1, (Date.now() - begin) / total);
      thump(0.3 + 0.6 * p); beatTimer = setTimeout(beat, 1000 - 650 * p);
    })();
  }
  function creak() {
    if (!ctx || !dread) return;
    try {
      var t = ctx.currentTime, o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(420, t + 0.7); o.frequency.exponentialRampToValueAtTime(260, t + 1.2);
      var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 8;
      var g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      o.connect(bp); bp.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 1.3);
    } catch (e) {}
  }
  function stopDread() {
    clearTimeout(beatTimer);
    if (dread) { dread.nodes.forEach(function (o) { try { o.stop(); } catch (e) {} }); dread = null; }
  }
  function blink() { document.body.style.opacity = '0'; setTimeout(function () { document.body.style.opacity = ''; }, 110); }
  // The face barely visible in the dark for a split second
  function ghost() {
    scare.style.display = 'flex'; scare.style.opacity = '0.07';
    setTimeout(function () { scare.style.display = ''; scare.style.opacity = ''; }, 140);
  }
  function runGrain() {
    var g = grain.getContext('2d'), im = g.createImageData(160, 160);
    grainTimer = setInterval(function () {
      for (var i = 0; i < im.data.length; i += 4) { var v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
      g.putImageData(im, 0, 0);
    }, 50);
  }

  function jump() {
    document.body.classList.remove('tense');
    wait.classList.remove('on'); wait.style.display = 'none';
    flash.classList.add('on'); scare.classList.add('on');
    runGrain(); scream();
    if (navigator.vibrate) { try { navigator.vibrate([200, 60, 200]); } catch (e) {} }
    setTimeout(function () { flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on'); thump(1); }, 1100);
    setTimeout(function () {
      clearInterval(grainTimer);
      scare.classList.remove('on'); flash.classList.remove('on');
      wait.style.display = ''; startBtn.style.display = ''; own.style.display = '';
      startBtn.textContent = 'Start again'; startBtn.disabled = false; startBtn.focus();
    }, 3800);
  }

  startBtn.addEventListener('click', function () {
    unlockAudio();
    startBtn.disabled = true; startBtn.style.display = 'none'; own.style.display = 'none';
    wait.classList.add('on');
    var total = 3500 + Math.random() * 2000;
    document.body.classList.add('tense');
    startDread(total);
    setTimeout(blink, total * 0.55);
    setTimeout(blink, total * 0.85);
    setTimeout(function () { stopDread(); setTimeout(jump, 500); }, total);
  });
})();
</script>
</body>
</html>
